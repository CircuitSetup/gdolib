name: Release

on:
  push:
    branches: [master]
    paths: [library.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version=$(jq -er '.version | strings' library.json)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::library.json version must use stable X.Y.Z numbering"
            exit 1
          fi

          previous_version=""
          if git cat-file -e "${BEFORE}:library.json" 2>/dev/null; then
            previous_version=$(git show "${BEFORE}:library.json" | jq -r '.version // empty')
          fi
          if [[ "$version" != "$previous_version" ]]; then
            echo "tag=v$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Run tests
        if: steps.version.outputs.tag != ''
        run: |
          make -C tests/host
          python3 -B -m unittest discover -s tests -v
      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == "true" ]]; then
              echo "::error::A draft release already exists for $TAG; publish or remove it before retrying"
              exit 1
            fi
            echo "Release $TAG already exists"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG" &&
             [[ "$(git rev-parse "refs/tags/${TAG}^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG already points to another commit"
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
